[package]
name = "wiki"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Static site from every repo in a pull workspace; git object ids decide what to regenerate"
repository = "https://github.com/jbisfun/wiki"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.43", default-features = false, features = ["chat-completion", "rustls"] }
clap = { version = "4.6.8", features = ["derive"] }
comrak = { version = "1.0.0", default-features = false, features = ["attributes", "syntect-onig"] }
fluent-templates = "0.15"
futures = "0.3.34"
git2 = "0.21.0"
gray_matter = "0.3.2"
ignore = "0.4.34"
jiff = "1.0.2"
lightningcss = { version = "1.0.0-alpha.72", features = ["bundler"] }
lol_html = "3.0.3"
minijinja = { version = "3.1.0", features = ["serde", "loop_controls"] }
path-clean = "1.0.1"
pathdiff = "0.2.3"
percent-encoding = "2.3.2"
regex = "1.13.1"
rolldown = "1.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3", default-features = false, features = ["default-themes", "html", "dump-load", "regex-onig", "parsing"] }
text-splitter = { version = "0.33", features = ["markdown"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
toml = "1.2.1"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
walkdir = "2.5.0"
