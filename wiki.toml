# Per-repo wiki settings, keyed by pull repo name. Everything is optional:
# every cloned repo gets a page from its README.md, pages from docs/, and
# code docs from the tools it is detected for (see docs/README.md).
#
#   skip = true                         leave the repo out of the wiki
#   category = "..."                    group label for the header's dropdowns (default "Other")
#   rust = false | { packages = [..] }  cargo doc --no-deps (default: default-members)
#   lua  = false | { files = [..] }     LDoc (default: tracked *.lua except *.x.lua hooks)
#   js   = false | { files = [..] }     JSDoc (default: tracked *.js/*.mjs, needs package.json)

[repos."jbisfun.github.io"]
skip = true # the published site itself

[repos.launchd]
skip = true # upstream reference clone

[repos.ycode]
category = "ycode"
# The whole Zed workspace is ~250 crates; document the ycode-specific ones.
rust = { packages = ["lua_hooks"] }

